name: docurag-agentops

services:
  backend:
    build:
      context: ../backend
      args:
        DOCURAG_INSTALL_REAL_OCR: ${DOCURAG_INSTALL_REAL_OCR:-false}
        DOCURAG_INSTALL_REDIS: ${DOCURAG_INSTALL_REDIS:-false}
        DOCURAG_INSTALL_NATS: ${DOCURAG_INSTALL_NATS:-false}
    environment:
      DOCURAG_APP_NAME: DocuRAG AgentOps Backend
      DOCURAG_VERSION: 0.40.0
      DOCURAG_ENVIRONMENT: docker
      DOCURAG_DATA_DIR: /app/data
      DOCURAG_OCR_PROVIDER: ${DOCURAG_OCR_PROVIDER:-paddleocr}
      DOCURAG_LLM_PROVIDER: ${DOCURAG_LLM_PROVIDER:-ollama}
      DOCURAG_LLM_BASE_URL: ${DOCURAG_LLM_BASE_URL:-http://host.docker.internal:11434}
      DOCURAG_LLM_MODEL: ${DOCURAG_LLM_MODEL:-qwen3.5:4b}
      DOCURAG_LLM_TIMEOUT_SECONDS: ${DOCURAG_LLM_TIMEOUT_SECONDS:-30}
      DOCURAG_LLM_API_KEY: ${DOCURAG_LLM_API_KEY:-}
      DOCURAG_VLM_PROVIDER: ${DOCURAG_VLM_PROVIDER:-ollama}
      DOCURAG_VLM_BASE_URL: ${DOCURAG_VLM_BASE_URL:-http://host.docker.internal:11434}
      DOCURAG_RAG_RETRIEVAL_PROVIDER: ${DOCURAG_RAG_RETRIEVAL_PROVIDER:-hybrid_rerank}
      DOCURAG_EMBEDDING_PROVIDER: ${DOCURAG_EMBEDDING_PROVIDER:-ollama}
      DOCURAG_EMBEDDING_BASE_URL: ${DOCURAG_EMBEDDING_BASE_URL:-http://host.docker.internal:11434}
      DOCURAG_RERANK_PROVIDER: ${DOCURAG_RERANK_PROVIDER:-fastembed}
      DOCURAG_QDRANT_URL: ${DOCURAG_QDRANT_URL:-http://qdrant:6333}
      DOCURAG_REDIS_URL: ${DOCURAG_REDIS_URL:-}
      DOCURAG_NATS_URL: ${DOCURAG_NATS_URL:-}
      DOCURAG_OBSERVABILITY_LOG_PATH: ${DOCURAG_OBSERVABILITY_LOG_PATH:-}
    volumes:
      - ../data:/app/data
    ports:
      - "8000:8000"

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

  redis:
    image: redis:7-alpine
    profiles:
      - redis
    ports:
      - "6379:6379"

  nats:
    image: nats:2-alpine
    command: ["-js"]
    profiles:
      - nats
    ports:
      - "4222:4222"
      - "8222:8222"

  loki:
    image: grafana/loki:latest
    profiles:
      - observability
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports:
      - "3100:3100"
    volumes:
      - ./observability/loki-config.yml:/etc/loki/local-config.yaml:ro

  promtail:
    image: grafana/promtail:latest
    profiles:
      - observability
    command: ["-config.file=/etc/promtail/config.yml"]
    volumes:
      - ./observability/promtail-config.yml:/etc/promtail/config.yml:ro
      - ../data/observability:/var/log/docurag:ro
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:latest
    profiles:
      - observability
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: ${DOCURAG_GRAFANA_ADMIN_PASSWORD:-docurag-local}
    ports:
      - "3000:3000"
    depends_on:
      - loki

volumes:
  qdrant_storage:
