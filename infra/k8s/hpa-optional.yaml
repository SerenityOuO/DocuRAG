apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: docurag-api-optional
  namespace: docurag
  labels:
    app.kubernetes.io/name: docurag-agentops
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: docurag-agentops
  annotations:
    docurag.io/optional-template: "true"
    docurag.io/boundary: "Example only; not backed by load testing or production SLOs."
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: docurag-api
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
